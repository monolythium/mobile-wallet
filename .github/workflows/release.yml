name: Release

# Triggers on tag pushes matching v* (e.g. v0.1.0). The version in the tag
# MUST match the version in tauri.conf.json; the workflow verifies this and
# fails fast if they drift.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Builds without uploading."
        required: false
        type: string
      track:
        description: "Play track (internal/alpha/beta/production). Default internal."
        required: false
        default: internal
        type: string

permissions:
  contents: write

env:
  # Cross-job: read tauri.conf.json so version + identifier stay single-source.
  TAURI_CONF: src-tauri/tauri.conf.json

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      identifier: ${{ steps.read.outputs.identifier }}
    steps:
      - uses: actions/checkout@v4
      - name: Read tauri.conf.json
        id: read
        run: |
          V=$(jq -r .version "$TAURI_CONF")
          ID=$(jq -r .identifier "$TAURI_CONF")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "identifier=$ID" >> "$GITHUB_OUTPUT"
          echo "::notice::tauri.conf.json version=$V identifier=$ID"
      - name: Tag matches tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CONF="v${{ steps.read.outputs.version }}"
          if [ "$TAG" != "$CONF" ]; then
            echo "::error::tag $TAG does not match tauri.conf.json ($CONF)"
            exit 1
          fi

  ios:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple Distribution certificate
        env:
          DIST_CERT_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KCHAIN_PWD=$(uuidgen)
          security create-keychain -p "$KCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KCHAIN_PWD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$DIST_CERT_BASE64" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -k build.keychain \
            -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KCHAIN_PWD" build.keychain
          rm /tmp/dist.p12

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$DIR/release.mobileprovision"

      - name: Decode App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Initialize iOS project (tauri ios init)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri ios init

      - name: Build iOS (.ipa)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri ios build --export-method app-store-connect

      - name: Locate IPA
        id: ipa
        run: |
          set -euo pipefail
          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::no IPA produced"; exit 1
          fi
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f "${{ steps.ipa.outputs.ipa }}" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: src-tauri/gen/apple/build/**/*.ipa

  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project (tauri android init)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: pnpm tauri android init

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > src-tauri/gen/android/upload.jks

      - name: Write Gradle signing config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Patch Gradle to consume keystore.properties
        run: |
          set -euo pipefail
          APP_GRADLE=src-tauri/gen/android/app/build.gradle.kts
          if ! grep -q "keystore.properties" "$APP_GRADLE"; then
            python3 .github/scripts/patch-gradle-signing.py "$APP_GRADLE"
          fi

      - name: Build Android (.aab)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: pnpm tauri android build --aab

      - name: Locate AAB
        id: aab
        run: |
          set -euo pipefail
          AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::no AAB produced"; exit 1
          fi
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play (internal track)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ needs.verify.outputs.identifier }}
          releaseFiles: ${{ steps.aab.outputs.aab }}
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  release:
    needs: [ios, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./artifacts/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
