[package]
name = "mobile-wallet"
version = "0.1.5"
edition = "2021"
rust-version = "1.77"
description = "Monolythium mobile wallet (Tauri 2 mobile, iOS + Android)"
license = "Apache-2.0"
publish = false

[lib]
name = "mobile_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mobile-wallet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# tauri-plugin-deep-link works on every Tauri target (desktop + mobile).
# On desktop it owns a single-instance handoff (Linux .desktop file / macOS
# Info.plist `CFBundleURLTypes` / Windows registry); on iOS it taps
# `Universal Links` + `Custom URL Schemes`; on Android it parses
# `intent-filter` data attributes. Same `on_open_url` callback shape for all.
tauri-plugin-deep-link = "2"
# `tauri-plugin-store` persists app state in JSON stores next to the vault:
# feature flags (flags.v1.json), the notifications history, and the durable
# tracked-tx set. Unencrypted and independently wipeable without disturbing
# the encrypted vault.
tauri-plugin-store = "2"
# `tauri-plugin-notification` raises native OS notifications (iOS/Android
# banner, desktop host toast) for confirmed/failed txs — additive to the
# in-app notifications center. Any-target like deep-link + store: on desktop
# it taps the host notification backend, on iOS UNUserNotificationCenter, on
# Android NotificationManager. The JS side requests permission on first use.
tauri-plugin-notification = "2"

# Mobile-only plugins. iOS Keychain Services + Android Keystore via
# tauri-plugin-keystore; Touch ID / Face ID / fingerprint via
# tauri-plugin-biometric. Both are mobile-only by upstream design — desktop
# builds fall through to a "not available" error from the host commands so
# `cargo check` on darwin/linux/windows stays green.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-biometric = "2"
# Keystore is still in alpha on crates.io (2.1.0-alpha.1 as of writing).
# Pinning the alpha is intentional — it's the only crate that targets both
# iOS Keychain Services and Android Keystore from a single Tauri 2 plugin.
tauri-plugin-keystore = "2.1.0-alpha.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
