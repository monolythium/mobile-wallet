[package]
name = "mobile-wallet"
version = "0.0.1"
edition = "2021"
rust-version = "1.77"
description = "Monolythium mobile wallet (Tauri 2 mobile, iOS + Android)"
license = "MIT"
publish = false

[lib]
name = "mobile_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mobile-wallet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
